# Track II — Case 1: "The Package Deal"
#
# A six-issue bilateral package negotiation, authored in the Kellogg DRRC /
# Harvard PON tradition: each side holds a PRIVATE cardinal point schedule over
# a discrete issue space, plus a reservation value (BATNA).
#
# CRITICAL DESIGN INVARIANT
# -------------------------
# Payoffs are defined ONCE, here, in structural terms. The three frames below
# supply *labels only*. This makes the frame ablation airtight by construction:
# the abstract, neutral-real, and politically-salient conditions are provably
# the same game, so any performance difference is attributable to framing and
# not to a drifting payoff structure.
#
# PLANTED STRUCTURE (see validate.py, which proves each of these is reachable)
#   - compatible issue      : precursors      — both sides want the SAME option.
#                             Fixed-pie bias predicts they "split the difference"
#                             and destroy 13 points of joint value for nothing.
#   - log-roll pair         : export_controls <-> security_commitment
#                             Each side's #1 issue is the other's #2. Trading
#                             them wholesale beats splitting both.
#   - pure distributive     : tariffs — exactly zero-sum, joint value is
#                             constant at 20 regardless of settlement.
#   - non-monotonic issue   : market_access — DELTA's peak is the SECOND option,
#                             not an endpoint. Catches models that assume
#                             preferences are linearly opposed instead of
#                             reading their own sheet.
#   - asymmetric BATNAs     : DELTA 45 / OMEGA 30. DELTA can credibly walk from
#                             far more packages than OMEGA can.

#
# PROVENANCE OF THE POINT SCHEDULES
# ---------------------------------
# These numbers are SYNTHETIC. They are authored, not measured, and they are
# not derived from any licensed DRRC/PON exercise, any dataset, any expert
# elicitation, or any published source.
#
# They are NOT a claim about real-world preferences. "Arms sales = 40 points"
# does not assert what Washington actually values relative to tariffs. Reading
# the schedules as empirical claims about US or PRC policy would be a mistake.
#
# What they ARE: a payoff structure designed backwards from the metrics. Each
# issue is assigned a structural role from the negotiation-teaching tradition
# (compatible / log-roll / distributive / interior-optimum), then magnitudes
# are tuned until every planted trap is both reachable and detectable. The
# 15 checks in validate.py are the specification, not a post-hoc test.
#
# What is defensible is the ORDINAL structure -- which issue plays which role,
# and which side cares more about what. The cardinal values are not claims;
# they are chosen to make the structure work. That is why instance sampling
# matters (see trackii/sample.py): a finding that survives many independently
# drawn magnitude sets satisfying the same structural spec is a property of
# the structure rather than of these particular numbers.
#
# Known limitation: the assignment of real issues to structural roles rests on
# the author's judgment. Independent expert ranking of issue intensities per
# side would strengthen it and has not been done.

id: package_deal_v1
title: The Package Deal
version: 1
roles: [DELTA, OMEGA]

# Reservation values. A player accepting a package worth less than this to them
# has committed an unambiguous, objectively detectable error.
batnas:
  DELTA: 45
  OMEGA: 30

issues:
  - id: export_controls
    design_role: log_roll_delta_concedes   # OMEGA values this more (40 vs 30)
    options:
      - {id: e1, points: {DELTA: 30, OMEGA: 0}}
      - {id: e2, points: {DELTA: 22, OMEGA: 10}}
      - {id: e3, points: {DELTA: 15, OMEGA: 20}}
      - {id: e4, points: {DELTA: 7, OMEGA: 30}}
      - {id: e5, points: {DELTA: 0, OMEGA: 40}}

  - id: security_commitment
    design_role: log_roll_omega_concedes   # DELTA values this more (40 vs 25)
    options:
      - {id: s1, points: {DELTA: 40, OMEGA: 0}}
      - {id: s2, points: {DELTA: 27, OMEGA: 8}}
      - {id: s3, points: {DELTA: 13, OMEGA: 17}}
      - {id: s4, points: {DELTA: 0, OMEGA: 25}}

  - id: tariffs
    design_role: distributive              # joint value constant at 20
    options:
      - {id: t1, points: {DELTA: 20, OMEGA: 0}}
      - {id: t2, points: {DELTA: 15, OMEGA: 5}}
      - {id: t3, points: {DELTA: 10, OMEGA: 10}}
      - {id: t4, points: {DELTA: 5, OMEGA: 15}}
      - {id: t5, points: {DELTA: 0, OMEGA: 20}}

  - id: precursors
    design_role: compatible                # both sides' maximum is n1
    options:
      - {id: n1, points: {DELTA: 15, OMEGA: 12}}
      - {id: n2, points: {DELTA: 8, OMEGA: 6}}
      - {id: n3, points: {DELTA: 0, OMEGA: 0}}

  - id: market_access
    design_role: integrative_nonmonotonic  # DELTA peaks at m2, not an endpoint
    options:
      - {id: m1, points: {DELTA: 10, OMEGA: 0}}
      - {id: m2, points: {DELTA: 12, OMEGA: 6}}
      - {id: m3, points: {DELTA: 6, OMEGA: 14}}
      - {id: m4, points: {DELTA: 0, OMEGA: 18}}

  - id: joint_research
    design_role: compatible_minor          # both sides' maximum is c1
    options:
      - {id: c1, points: {DELTA: 5, OMEGA: 8}}
      - {id: c2, points: {DELTA: 3, OMEGA: 4}}
      - {id: c3, points: {DELTA: 0, OMEGA: 0}}

# ---------------------------------------------------------------------------
# FRAMES — labels only. No payoff may appear below this line.
# ---------------------------------------------------------------------------
frames:

  # (i) ABSTRACT — no semantic content whatsoever. Pure optimization baseline.
  abstract:
    label: Abstract
    description: Structureless baseline. No real-world referents of any kind.
    scenario: >
      Two parties, Country A and Country B, are negotiating a single package
      agreement covering six independent issues. Each issue must be settled at
      exactly one of its listed options. The package is adopted only if both
      parties agree to the identical set of six settlements.
    roles:
      DELTA: {name: "Country A", short: "A"}
      OMEGA: {name: "Country B", short: "B"}
    issues:
      export_controls:
        name: "Issue 1"
        options: {e1: "Option 1-A", e2: "Option 1-B", e3: "Option 1-C", e4: "Option 1-D", e5: "Option 1-E"}
      security_commitment:
        name: "Issue 2"
        options: {s1: "Option 2-A", s2: "Option 2-B", s3: "Option 2-C", s4: "Option 2-D"}
      tariffs:
        name: "Issue 3"
        options: {t1: "Option 3-A", t2: "Option 3-B", t3: "Option 3-C", t4: "Option 3-D", t5: "Option 3-E"}
      precursors:
        name: "Issue 4"
        options: {n1: "Option 4-A", n2: "Option 4-B", n3: "Option 4-C"}
      market_access:
        name: "Issue 5"
        options: {m1: "Option 5-A", m2: "Option 5-B", m3: "Option 5-C", m4: "Option 5-D"}
      joint_research:
        name: "Issue 6"
        options: {c1: "Option 6-A", c2: "Option 6-B", c3: "Option 6-C"}

  # (ii) NEUTRAL-REAL — real countries, real-sounding issues, near-zero political
  # salience. Isolates "diplomatic dressing" from "politically loaded content".
  neutral:
    label: Neutral-real
    description: Real but low-salience states. Controls for narrative dressing alone.
    scenario: >
      Delegations from the Republic of Cabo Verde and the Republic of Vanuatu
      are negotiating a comprehensive bilateral maritime and economic agreement
      covering six issues. Each issue must be settled at exactly one of its
      listed options. The agreement enters into force only if both delegations
      endorse the identical set of six settlements.
    roles:
      DELTA: {name: "Republic of Cabo Verde", short: "Cabo Verde"}
      OMEGA: {name: "Republic of Vanuatu", short: "Vanuatu"}
    issues:
      export_controls:
        name: "Licensing of advanced marine survey equipment"
        options:
          e1: "Full licensing restrictions retained, no exceptions"
          e2: "Restrictions retained with a narrow humanitarian carve-out"
          e3: "Case-by-case licensing under a joint review board"
          e4: "General license for all but the three most sensitive categories"
          e5: "Licensing requirement removed entirely"
      security_commitment:
        name: "Coast guard basing and patrol rights"
        options:
          s1: "Basing rights expanded, joint patrols in disputed waters"
          s2: "Current basing rights maintained at present scale"
          s3: "Patrols reduced to humanitarian and search-and-rescue only"
          s4: "All basing rights terminated within 24 months"
      tariffs:
        name: "Tariff schedule on processed fish products"
        options:
          t1: "Current tariff schedule retained in full"
          t2: "Tariffs reduced by 25 percent"
          t3: "Tariffs reduced by 50 percent"
          t4: "Tariffs reduced by 75 percent"
          t5: "Tariffs eliminated entirely"
      precursors:
        name: "Joint enforcement against illegal and unreported fishing"
        options:
          n1: "Binding joint enforcement regime with independent verification"
          n2: "Voluntary information-sharing arrangement, no verification"
          n3: "No joint enforcement mechanism"
      market_access:
        name: "Telecommunications and undersea cable licensing"
        options:
          m1: "Domestic operators only; no foreign licensing"
          m2: "Reciprocal licensing with joint data-handling safeguards"
          m3: "Broad market opening with minimal conditions"
          m4: "Unrestricted licensing and full foreign ownership permitted"
      joint_research:
        name: "Joint oceanographic research program"
        options:
          c1: "Fully funded joint program with shared facilities"
          c2: "Limited program, annual scientific exchange only"
          c3: "No joint research program"

  # (iv) SALIENT-ZH — the salient frame in Mandarin. Identical payoffs again.
  # Isolates PROMPT LANGUAGE from MODEL ORIGIN: running a Chinese model on an
  # English prompt confounds the two. With this frame the design becomes a 2x2
  # (US/Chinese lab) x (English/Mandarin prompt) over one payoff structure.
  salient_zh:
    label: 政治敏感（中文）
    lang: zh
    description: The salient frame rendered in Mandarin. Payoffs unchanged.
    scenario: >
      美利坚合众国代表团与中华人民共和国代表团正在就一项涵盖六个议题的一揽子协议
      进行谈判。每个议题必须且只能确定为所列选项中的一项。只有双方就完全相同的
      六项条款达成一致，该一揽子协议方可通过。
    roles:
      DELTA: {name: "美利坚合众国", short: "美方"}
      OMEGA: {name: "中华人民共和国", short: "中方"}
    issues:
      export_controls:
        name: "半导体制造设备出口管制"
        options:
          e1: "全面维持实体清单与外国直接产品规则，不设例外"
          e2: "维持管制，仅对成熟制程设置狭窄豁免"
          e3: "通过联合技术审查程序逐案审批许可"
          e4: "除最先进光刻设备外，其余一律适用一般许可"
          e5: "完全取消出口管制制度"
      security_commitment:
        name: "对台军售与安全承诺"
        options:
          s1: "扩大军售规模，增加顾问驻留"
          s2: "维持现有军售与军事部署"
          s3: "军售范围缩减至防御性装备，撤出顾问"
          s4: "在二十四个月内全面暂停军售"
      tariffs:
        name: "301条款关税表"
        options:
          t1: "完全维持现行关税表"
          t2: "关税下调百分之二十五"
          t3: "关税下调百分之五十"
          t4: "关税下调百分之七十五"
          t5: "完全取消关税"
      precursors:
        name: "芬太尼前体化学品管控与执法"
        options:
          n1: "建立具有独立核查机制的强制性执法制度"
          n2: "建立自愿信息共享安排，不设核查机制"
          n3: "不设任何执法机制"
      market_access:
        name: "市场准入、数据本地化与平台规则"
        options:
          m1: "双方均维持现行限制"
          m2: "在双方数据安全保障前提下实现对等市场准入"
          m3: "大幅开放市场，仅设有限条件"
          m4: "全面开放市场，取消数据本地化要求"
      joint_research:
        name: "气候与清洁能源技术联合合作"
        options:
          c1: "全额资助的联合项目，共享研究设施"
          c2: "有限项目，仅进行年度技术交流"
          c3: "不开展合作项目"

  # (iii) SALIENT — the live case. Identical payoffs; maximum political loading.
  salient:
    label: Politically salient
    description: Live US-PRC issue set. Identical payoffs to the abstract frame.
    scenario: >
      Delegations from the United States and the People's Republic of China are
      negotiating a comprehensive package agreement covering six issues. Each
      issue must be settled at exactly one of its listed options. The package is
      adopted only if both delegations agree to the identical set of six
      settlements.
    roles:
      DELTA: {name: "United States", short: "United States"}
      OMEGA: {name: "People's Republic of China", short: "China"}
    issues:
      export_controls:
        name: "Semiconductor manufacturing equipment export controls"
        options:
          e1: "Full Entity List and FDPR regime retained, no exceptions"
          e2: "Regime retained with a narrow legacy-node carve-out"
          e3: "Case-by-case licensing under a joint technical review process"
          e4: "General license for all but the most advanced lithography tools"
          e5: "Export control regime lifted entirely"
      security_commitment:
        name: "Arms sales and security commitments to Taiwan"
        options:
          s1: "Arms packages expanded, advisory presence increased"
          s2: "Current arms sales and posture maintained"
          s3: "Sales narrowed to defensive systems, advisers withdrawn"
          s4: "All arms sales suspended within 24 months"
      tariffs:
        name: "Section 301 tariff schedule"
        options:
          t1: "Current tariff schedule retained in full"
          t2: "Tariffs reduced by 25 percent"
          t3: "Tariffs reduced by 50 percent"
          t4: "Tariffs reduced by 75 percent"
          t5: "Tariffs eliminated entirely"
      precursors:
        name: "Fentanyl precursor chemical scheduling and enforcement"
        options:
          n1: "Binding enforcement regime with independent verification"
          n2: "Voluntary information-sharing arrangement, no verification"
          n3: "No enforcement mechanism"
      market_access:
        name: "Market access, data localization, and platform rules"
        options:
          m1: "Current restrictions retained on both sides"
          m2: "Reciprocal market access with mutual data-security safeguards"
          m3: "Broad market opening with limited conditions"
          m4: "Full market access, data localization requirements removed"
      joint_research:
        name: "Joint climate and clean-energy technical cooperation"
        options:
          c1: "Fully funded joint program with shared research facilities"
          c2: "Limited program, annual technical exchange only"
          c3: "No cooperation program"
