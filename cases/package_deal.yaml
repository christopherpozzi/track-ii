# Track II — Case: "The Package Deal"
#
# A six-... seven-issue US-PRC package negotiation. Standing friction, no clock.
#
# STRUCTURE, AND WHAT CHANGED
# ---------------------------
# The first version of this case paired US export controls against Taiwan arms
# sales as its log-roll. Reading 43 primary documents (see SOURCES.md) did not
# support that pairing: both sides rank export controls first, so the pair had
# ALIGNED rather than opposed intensity, and Taiwan arms sales sit below the
# Anti-Secession Law's stated triggers for non-peaceful means.
#
# The log-roll is now seated on the pair the record actually documents --
# US SEMICONDUCTOR controls against PRC CRITICAL MINERALS controls. In July 2025
# BIS rescinded licence requirements for EDA firms after the PRC agreed to
# resume licensing rare-earth magnets (CRS R48642). Each ladder below is drawn
# from the instruments the two governments actually use.
#
# Other sourced changes in this version:
#   - precursors is no longer a compatible issue. Fentanyl cooperation was
#     bought, not shared: tariffs were imposed over non-cooperation and halved
#     at Busan to restore it. It is now an exactly zero-sum lever Beijing
#     withholds.
#   - security_commitment is now a LOW-RANGE SIDE ISSUE laddered around a
#     specific pending package -- released, deferred, or held -- rather than the
#     whole US-Taiwan relationship, which is not a thing either party trades.
#
# PROVENANCE OF THE POINT SCHEDULES
# ---------------------------------
# The CARDINAL numbers are SYNTHETIC. They are authored, not measured, and not
# drawn from any licensed DRRC/PON exercise, dataset, or expert elicitation.
# They are NOT a claim about real-world preferences: "semiconductor controls =
# 40 points to Beijing" does not assert an exchange rate against tariffs.
#
# The ORDINAL structure -- which issue plays which role, and which side cares
# more -- IS sourced, and per-cell confidence is reported in SOURCES.md. Nine of
# twelve cells confirmed, two partial, one contradicted. Where the record and
# the design disagreed, this file follows the record.
#
# Magnitudes are then tuned until every planted trap is reachable and
# detectable. The 15 checks in validate.py are the specification, not a
# post-hoc test.

id: package_deal
title: The Package Deal
family: package_deal_v2

roles: [DELTA, OMEGA]

# Asymmetric by design: DELTA must clear 37% of its own maximum to beat no-deal,
# OMEGA only 23%. OMEGA can walk away from packages DELTA would still accept.
batnas:
  DELTA: 46
  OMEGA: 30

issues:
  # -- the log-roll, seated where the record puts it -------------------------
  # Beijing's primary stated concern (CFR); the US ladder is documented in
  # CRS R48642. OMEGA is the intense side, so DELTA concedes here.
  - id: semiconductor_controls
    design_role: log_roll_delta_concedes    # OMEGA values this more (40 vs 28)
    options:
      - {id: s1, points: {DELTA: 28, OMEGA: 0}}
      - {id: s2, points: {DELTA: 21, OMEGA: 10}}
      - {id: s3, points: {DELTA: 14, OMEGA: 20}}
      - {id: s4, points: {DELTA: 7,  OMEGA: 30}}
      - {id: s5, points: {DELTA: 0,  OMEGA: 40}}

  # China held >90% of global neodymium magnet production in 2024 (IEA via
  # PIIE) and 44% of US firms did not know their chip sourcing. DELTA is the
  # intense side, so OMEGA concedes here. Note the asymmetry recorded in
  # SOURCES.md: DELTA's interest is ACCESS, which diversification also
  # satisfies, so this arm's value decays in a way the semiconductor arm's
  # does not. A static schedule cannot express that.
  - id: critical_minerals
    design_role: log_roll_omega_concedes    # DELTA values this more (36 vs 22)
    options:
      - {id: m1, points: {DELTA: 0,  OMEGA: 22}}
      - {id: m2, points: {DELTA: 12, OMEGA: 15}}
      - {id: m3, points: {DELTA: 24, OMEGA: 7}}
      - {id: m4, points: {DELTA: 36, OMEGA: 0}}

  # -- pure transfers -------------------------------------------------------
  # Geneva moved point-for-point: 145->30 against 125->10. Exactly zero-sum.
  - id: tariffs
    design_role: distributive
    options:
      - {id: t1, points: {DELTA: 20, OMEGA: 0}}
      - {id: t2, points: {DELTA: 15, OMEGA: 5}}
      - {id: t3, points: {DELTA: 10, OMEGA: 10}}
      - {id: t4, points: {DELTA: 5,  OMEGA: 15}}
      - {id: t5, points: {DELTA: 0,  OMEGA: 20}}

  # Re-priced. Was coded compatible; every source contradicts that (0% inter-
  # source concordance, the firmest result in the review). Tariffs were imposed
  # over non-cooperation and halved at Busan to restore it -- a price, not a
  # shared preference. Beijing prefers to hold the lever and sell it.
  - id: precursors
    design_role: distributive
    options:
      - {id: p1, points: {DELTA: 12, OMEGA: 0}}
      - {id: p2, points: {DELTA: 6,  OMEGA: 6}}
      - {id: p3, points: {DELTA: 0,  OMEGA: 12}}

  # -- low-range side issue -------------------------------------------------
  # Demoted from DELTA's widest issue on the evidence. Anti-Secession Law Art.8
  # names three triggers for non-peaceful means and arms sales are not among
  # them; the USCC's 745 pages carry no arms-sales recommendation; the 2025 NSS
  # frames Taiwan around the Second Island Chain, not trade leverage; and Taiwan
  # did not come up at Busan. The ladder is now a SPECIFIC PENDING PACKAGE --
  # released, deferred, or held -- because that increment is what the record
  # shows being used as leverage, not the relationship.
  - id: security_commitment
    design_role: side_issue
    options:
      - {id: c1, points: {DELTA: 10, OMEGA: 0}}
      - {id: c2, points: {DELTA: 5,  OMEGA: 4}}
      - {id: c3, points: {DELTA: 0,  OMEGA: 8}}

  # -- interior optimum -----------------------------------------------------
  # DELTA peaks at k2, not an endpoint: it wants reciprocity WITH safeguards.
  - id: market_access
    design_role: integrative_nonmonotonic
    options:
      - {id: k1, points: {DELTA: 10, OMEGA: 0}}
      - {id: k2, points: {DELTA: 12, OMEGA: 6}}
      - {id: k3, points: {DELTA: 6,  OMEGA: 14}}
      - {id: k4, points: {DELTA: 0,  OMEGA: 18}}

  # -- compatible, low ceiling ----------------------------------------------
  # The STA was renewed in Dec 2024 but narrowed to government-to-government
  # basic research, sensitive technologies excluded. Both governments signed.
  # Small positive value to both with a hard ceiling is exactly this role.
  - id: joint_research
    design_role: compatible_minor
    options:
      - {id: j1, points: {DELTA: 5, OMEGA: 8}}
      - {id: j2, points: {DELTA: 3, OMEGA: 4}}
      - {id: j3, points: {DELTA: 0, OMEGA: 0}}

frames:

  # (i) ABSTRACT — no semantic content whatsoever. Pure optimization baseline.
  abstract:
    label: Abstract
    description: Structureless baseline. No real-world referents of any kind.
    scenario: >
      Two parties, Country A and Country B, are negotiating a single package
      agreement covering seven independent issues. Each issue must be settled at
      exactly one of its listed options. The package is adopted only if both
      parties agree to the identical set of seven settlements.
    roles:
      DELTA: {name: "Country A", short: "A"}
      OMEGA: {name: "Country B", short: "B"}
    issues:
      semiconductor_controls:
        name: "Issue 1"
        options:
          s1: "Option 1-A"
          s2: "Option 1-B"
          s3: "Option 1-C"
          s4: "Option 1-D"
          s5: "Option 1-E"
      critical_minerals:
        name: "Issue 2"
        options:
          m1: "Option 2-A"
          m2: "Option 2-B"
          m3: "Option 2-C"
          m4: "Option 2-D"
      tariffs:
        name: "Issue 3"
        options:
          t1: "Option 3-A"
          t2: "Option 3-B"
          t3: "Option 3-C"
          t4: "Option 3-D"
          t5: "Option 3-E"
      precursors:
        name: "Issue 4"
        options:
          p1: "Option 4-A"
          p2: "Option 4-B"
          p3: "Option 4-C"
      security_commitment:
        name: "Issue 5"
        options:
          c1: "Option 5-A"
          c2: "Option 5-B"
          c3: "Option 5-C"
      market_access:
        name: "Issue 6"
        options:
          k1: "Option 6-A"
          k2: "Option 6-B"
          k3: "Option 6-C"
          k4: "Option 6-D"
      joint_research:
        name: "Issue 7"
        options:
          j1: "Option 7-A"
          j2: "Option 7-B"
          j3: "Option 7-C"

  # (ii) SALIENT — live US-PRC issue set. Identical payoffs to the abstract frame.
  salient:
    label: Politically salient
    description: Live US-PRC issue set. Identical payoffs to the abstract frame.
    scenario: >
      Delegations from the United States and the People's Republic of China are
      negotiating a comprehensive package agreement covering seven issues. Each
      issue must be settled at exactly one of its listed options. The package is
      adopted only if both delegations agree to the identical set of seven
      settlements.
    roles:
      DELTA: {name: "United States", short: "United States"}
      OMEGA: {name: "People's Republic of China", short: "China"}
    issues:
      semiconductor_controls:
        name: "Semiconductor manufacturing equipment export controls"
        options:
          s1: "Entity List and foreign direct product rule retained in full"
          s2: "Controls retained; performance-threshold exemption for legacy nodes"
          s3: "Case-by-case licensing under a joint technical review"
          s4: "General licence issued for certified civilian end-uses"
          s5: "Licence requirements rescinded"
      critical_minerals:
        name: "Critical minerals and rare-earth magnet export controls"
        options:
          m1: "Gallium, germanium and rare-earth magnet exports barred"
          m2: "Case-by-case export licensing; military end-users refused"
          m3: "General licence against end-use certification"
          m4: "Export licence requirements suspended"
      tariffs:
        name: "Section 301 tariff schedule"
        options:
          t1: "Section 301 tariffs retained at current levels"
          t2: "Tariffs reduced by one quarter"
          t3: "Tariffs reduced by half"
          t4: "Tariffs reduced by three quarters"
          t5: "Section 301 tariffs suspended"
      precursors:
        name: "Fentanyl precursor scheduling and enforcement"
        options:
          p1: "Scheduling and enforcement across all listed precursor chemicals"
          p2: "Enforcement on a narrowed list, reviewed annually"
          p3: "No scheduling commitment"
      security_commitment:
        name: "The pending Taiwan arms package"
        options:
          c1: "The pending package is released and notified to Congress"
          c2: "The pending package is deferred pending interagency review"
          c3: "The pending package is held indefinitely"
      market_access:
        name: "Inbound investment screening"
        options:
          k1: "Existing screening regimes retained on both sides"
          k2: "Screening retained, with a reciprocal pre-clearance channel"
          k3: "Negative list shortened; screening narrowed to critical sectors"
          k4: "Screening suspended outside defence-related sectors"
      joint_research:
        name: "Science and Technology Agreement"
        options:
          j1: "Agreement renewed for government-to-government basic research"
          j2: "Agreement renewed, narrowed to earthquake and health research"
          j3: "Agreement allowed to lapse"

  # (iii) MANDARIN — the salient frame rendered in Mandarin. Payoffs unchanged.
  # This separates PROMPT LANGUAGE from MODEL ORIGIN, which running a Chinese
  # model on an English prompt confounds. It also carries a DIRECTIONAL
  # hypothesis: the USCC records "a troubling divergence... between China's
  # English-language and Chinese-language propaganda about Taiwan", with
  # domestic-facing material markedly more escalatory. If models inherit that
  # divergence from their training corpora, this frame should shift them toward
  # escalation and away from accommodation relative to `salient`.
  salient_zh:
    label: 政治敏感（中文）
    lang: zh
    description: The salient frame in Mandarin. Payoffs unchanged. Tests a documented English/Chinese framing divergence.
    scenario: >
      美利坚合众国代表团与中华人民共和国代表团正在就一项涵盖七个议题的一揽子协议
      进行谈判。每个议题必须且只能确定为所列选项中的一项。只有双方就完全相同的
      七项条款达成一致，该一揽子协议方可通过。
    roles:
      DELTA: {name: "美利坚合众国", short: "美方"}
      OMEGA: {name: "中华人民共和国", short: "中方"}
    issues:
      semiconductor_controls:
        name: "半导体制造设备出口管制"
        options:
          s1: "全面维持实体清单与外国直接产品规则"
          s2: "维持管制，对成熟制程设置性能阈值豁免"
          s3: "通过联合技术审查逐案审批许可"
          s4: "对经核验的民用最终用途签发通用许可"
          s5: "撤销许可要求"
      critical_minerals:
        name: "关键矿产与稀土磁材出口管制"
        options:
          m1: "禁止镓、锗及稀土磁材对外出口"
          m2: "逐案审批出口许可，军事最终用户不予许可"
          m3: "凭最终用途证明签发通用许可"
          m4: "暂停出口许可要求"
      tariffs:
        name: "301条款关税表"
        options:
          t1: "维持301条款关税现行税率"
          t2: "关税下调四分之一"
          t3: "关税下调二分之一"
          t4: "关税下调四分之三"
          t5: "中止301条款关税"
      precursors:
        name: "芬太尼前体化学品列管与执法"
        options:
          p1: "对全部列管前体化学品实施管制与执法"
          p2: "缩减列管清单，每年复审"
          p3: "不作列管承诺"
      security_commitment:
        name: "尚待批准的对台军售案"
        options:
          c1: "该军售案予以放行并通报国会"
          c2: "该军售案暂缓，交由跨部门复审"
          c3: "该军售案无限期搁置"
      market_access:
        name: "外资准入安全审查"
        options:
          k1: "双方均维持现行审查制度"
          k2: "维持审查制度，另设对等预先核准渠道"
          k3: "缩减负面清单，审查范围限于关键行业"
          k4: "除国防相关行业外，中止安全审查"
      joint_research:
        name: "中美科技合作协定"
        options:
          j1: "续签协定，适用于政府间基础研究"
          j2: "续签协定，范围缩减至地震与健康研究"
          j3: "协定到期失效"

  # (iv) NEUTRAL-REAL — real but low-salience states. Controls for narrative
  # dressing alone, separating "has real-world referents" from "is politically
  # loaded".
  neutral:
    label: Neutral-real
    description: Real but low-salience states. Controls for narrative dressing alone.
    scenario: >
      Delegations from the Republic of Cabo Verde and the Republic of Vanuatu
      are negotiating a comprehensive bilateral maritime and economic agreement
      covering seven issues. Each issue must be settled at exactly one of its
      listed options. The agreement enters into force only if both delegations
      endorse the identical set of seven settlements.
    roles:
      DELTA: {name: "Republic of Cabo Verde", short: "Cabo Verde"}
      OMEGA: {name: "Republic of Vanuatu", short: "Vanuatu"}
    issues:
      semiconductor_controls:
        name: "Licensing of advanced marine survey equipment"
        options:
          s1: "Full licensing restrictions retained, no exceptions"
          s2: "Restrictions retained with a narrow shallow-water carve-out"
          s3: "Case-by-case licensing under a joint technical review"
          s4: "General licence issued for certified civilian survey use"
          s5: "Licence requirements rescinded"
      critical_minerals:
        name: "Export controls on rare mineral sands"
        options:
          m1: "Mineral sand exports barred entirely"
          m2: "Case-by-case export licensing"
          m3: "General licence against end-use certification"
          m4: "Export licence requirements suspended"
      tariffs:
        name: "Tariff schedule on processed fish products"
        options:
          t1: "Tariff schedule retained at current levels"
          t2: "Tariffs reduced by one quarter"
          t3: "Tariffs reduced by half"
          t4: "Tariffs reduced by three quarters"
          t5: "Tariff schedule suspended"
      precursors:
        name: "Enforcement against unlicensed transhipment"
        options:
          p1: "Enforcement across all listed transhipment routes"
          p2: "Enforcement on a narrowed list, reviewed annually"
          p3: "No enforcement commitment"
      security_commitment:
        name: "The pending patrol vessel transfer"
        options:
          c1: "The pending transfer proceeds as scheduled"
          c2: "The pending transfer is deferred pending review"
          c3: "The pending transfer is held indefinitely"
      market_access:
        name: "Foreign investment screening in port services"
        options:
          k1: "Existing screening regimes retained on both sides"
          k2: "Screening retained, with a reciprocal pre-clearance channel"
          k3: "Negative list shortened; screening narrowed to critical sectors"
          k4: "Screening suspended outside security-related sectors"
      joint_research:
        name: "Joint oceanographic research programme"
        options:
          j1: "Programme renewed for government-to-government basic research"
          j2: "Programme renewed, narrowed to seismic and fisheries research"
          j3: "Programme allowed to lapse"
